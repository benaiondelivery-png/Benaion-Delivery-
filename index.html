<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benaion Delivery</title>
    <style>
        :root { --vermelho: #bc0000; --amarelo: #f2b705; --fundo: #f4f4f4; --sucesso: #25d366; }
        body { font-family: 'Arial Black', sans-serif; margin: 0; background: var(--fundo); color: #333; }
        
        header { background: var(--vermelho); color: white; padding: 40px 15px; text-align: center; border-bottom: 6px solid var(--amarelo); }
        .logo-main { margin: 0; font-style: italic; color: var(--amarelo); font-size: 3.2rem; line-height: 1; text-shadow: 3px 3px 0px #000; letter-spacing: -2px; transform: skew(-5deg); cursor: pointer; }
        .logo-sub { margin: 0; letter-spacing: 6px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; color: white; margin-top: -5px; }

        .status-bar { text-align: center; padding: 10px; font-weight: bold; font-size: 1.1rem; margin: -15px auto 0; border-radius: 0 0 15px 15px; max-width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        .aberto { background: var(--sucesso); color: white; }
        .fechado { background: #555; color: white; }

        .container { max-width: 500px; margin: 20px auto; padding: 15px; padding-bottom: 80px; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-left: 6px solid var(--vermelho); }
        h3 { color: var(--vermelho); margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.1rem; text-transform: uppercase; }
        
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.8rem; color: #444; text-transform: uppercase; }
        /* Campos agora Brancos e Claros */
        input, textarea, select { width: 100%; padding: 14px; margin-top: 5px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; font-family: sans-serif; background: #ffffff !important; color: #000; }
        
        .btn-enviar { background: var(--sucesso); color: white; border: none; width: 100%; padding: 22px; border-radius: 15px; font-weight: bold; font-size: 1.4rem; cursor: pointer; margin-top: 25px; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); }
        
        /* Botão de Reset Oculto (Aparece com clique triplo na logo) */
        #btn-admin { display: none; background: #333; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 10px; font-size: 0.7rem; cursor: pointer; }
        
        .footer { text-align: center; font-family: sans-serif; font-size: 0.8rem; color: #888; margin-top: 30px; }
    </style>
</head>
<body>

<header>
    <div onclick="ativarAdmin()">
        <h1 class="logo-main">BENAION</h1>
        <p class="logo-sub">DELIVERY</p>
    </div>
</header>

<div id="status-loja" class="status-bar">Carregando...</div>

<div class="container">
    <div class="card">
        <h3>📋 FORMULÁRIO DE PEDIDO</h3>
        
        <label>Seu Nome (Cliente):</label>
        <input type="text" id="cliente" placeholder="Nome completo">

        <label>Onde buscamos? (Retirada):</label>
        <input type="text" id="retirada" placeholder="Endereço da retirada">

        <label>O que é o produto? (Pode pular linha):</label>
        <textarea id="produto" rows="4" placeholder="Ex:&#10;1x Remédio&#10;2x Pães"></textarea>

        <label>Endereço de Entrega:</label>
        <textarea id="entrega" rows="3" placeholder="Rua, número e bairro"></textarea>

        <label>Pagamento:</label>
        <select id="pagamento">
            <option value="PIX💰">PIX</option>
            <option value="CARTÃO💳">CARTÃO</option>
            <option value="DINHEIRO💵">DINHEIRO</option>
        </select>

        <label>Observações:</label>
        <textarea id="obs" placeholder="Algum detalhe extra?"></textarea>

        <button class="btn-enviar" onclick="enviarWhatsApp()">ENVIAR PEDIDO 🛵</button>
        
        <button id="btn-admin" onclick="resetarContador()">🔄 REINICIAR Nº DA COMANDA (ADMIN)</button>
    </div>

    <div class="footer">
        Benaion Delivery © 2023<br>
        Atendimento Rápido e Seguro
    </div>
</div>

<script>
    let cliquesLogo = 0;
    function ativarAdmin() {
        cliquesLogo++;
        if(cliquesLogo >= 3) {
            document.getElementById('btn-admin').style.display = 'block';
        }
    }

    function verificarStatus() {
        const agora = new Date();
        const dia = agora.getDay();
        const hora = agora.getHours() + agora.getMinutes()/60;
        const statusDiv = document.getElementById('status-loja');
        if (dia !== 6 && hora >= 7.5 && hora < 18) {
            statusDiv.innerText = "🟢 ABERTO AGORA"; statusDiv.className = "status-bar aberto";
        } else {
            statusDiv.innerText = "🔴 FECHADO AGORA"; statusDiv.className = "status-bar fechado";
        }
    }

    function enviarWhatsApp() {
        let n = parseInt(localStorage.getItem('n_benaion')) || 0;
        n++; localStorage.setItem('n_benaion', n);
        
        const telefone = "5596991677854";
        const msg = `*✅️ COMANDA Nº ${n} 🗒*\n\n` +
                    `> *CLIENTE🙋‍♂️*: ${document.getElementById('cliente').value}\n` +
                    `> *ENTREGADOR🛵*: ........ \n` +
                    `> *RETIRADA🛒*: ${document.getElementById('retirada').value}\n` +
                    `> *PRODUTO📦*: \n${document.getElementById('produto').value}\n` +
                    `> *ENTREGA🏡*: ${document.getElementById('entrega').value}\n` +
                    `> *PAGAMENTO💰*: ${document.getElementById('pagamento').value}\n` +
                    `> *OBS*: ${document.getElementById('obs').value}\n\n` +
                    `*<<<<FIM DE COMANDA>>>>*`;

        window.open(`https://wa.me/${telefone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function resetarContador() {
        if(confirm("Zerar a numeração das comandas?")) {
            localStorage.setItem('n_benaion', 0);
            alert("Contagem zerada!");
            document.getElementById('btn-admin').style.display = 'none';
            cliquesLogo = 0;
        }
    }

    verificarStatus();
</script>
</body>
</html>
